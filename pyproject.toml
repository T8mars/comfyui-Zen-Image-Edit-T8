[project]
name = "zen-image-edit-t8"
version = "0.1.2"
description = "Native ComfyUI nodes for Zen Image Edit with a single-file Qwen-Image-2.1 checkpoint and student text encoder."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "transformers>=5.17,<6",
    "tokenizers>=0.23,<1",
    "safetensors>=0.8,<1",
]

[project.urls]
Repository = "https://github.com/T8mars/comfyui-Zen-Image-Edit-T8"
Documentation = "https://github.com/T8mars/comfyui-Zen-Image-Edit-T8#readme"
"Bug Tracker" = "https://github.com/T8mars/comfyui-Zen-Image-Edit-T8/issues"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "Zen Image Edit T8"
requires-comfyui = ">=0.37.0"
